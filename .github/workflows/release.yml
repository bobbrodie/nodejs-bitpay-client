name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from (e.g., 7.0.x)'
        required: true
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      overview:
        description: 'Release overview (will be placed at top of notes)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Push version bump and tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          version=$(jq -r .version package.json)
          git add package.json package-lock.json
          git commit -m "Bump version to $version"
          git tag $version
          git push origin ${{ github.event.inputs.branch }}
          git push origin $version

      - name: Get merged PR titles and format release notes
        id: changelog
        run: |
          prev_tag=$(git describe --tags --abbrev=0 HEAD^)
          new_tag=$(git describe --tags --abbrev=0)

          prs=$(gh pr list --state merged --base "${{ github.event.inputs.branch }}" --json title,mergedAt --jq '[.[] | select(.mergedAt != null) | .title]')
          joined=$(echo "$prs" | jq -r '.[]' | sed 's/^/* /')

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "${{ github.event.inputs.overview }}" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "## What's Changed" >> $GITHUB_ENV
          echo "$joined" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prev_tag...$new_tag" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        run: |
          tag=$(git describe --tags --abbrev=0)
          gh release create "$tag" --title "$tag" --notes "${{ env.RELEASE_NOTES }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

